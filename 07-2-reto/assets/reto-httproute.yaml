apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: reto-canary
  namespace: lab-07
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
  rules:
    - matches:                       # regla 1: QA con cabecera -> 100% v2
        - path:
            type: PathPrefix
            value: /lab07/reto
          headers:
            - name: x-version
              value: v2
      backendRefs:
        - name: whoami-v2
          port: 80
    - matches:                       # regla 2: resto del trafico -> 80/20
        - path:
            type: PathPrefix
            value: /lab07/reto
      backendRefs:
        - name: whoami-v1
          port: 80
          weight: 80
        - name: whoami-v2
          port: 80
          weight: 20
