apiVersion: v1
kind: Pod
metadata:
  name: reto-sidecar
  namespace: lab-07
spec:
  terminationGracePeriodSeconds: 5
  volumes:
    - name: datos
      emptyDir: {}
  initContainers:
    - name: shipper
      image: busybox:1.37
      restartPolicy: Always
      command: ["sh", "-c", "tail -F /datos/app.log"]
      volumeMounts:
        - name: datos
          mountPath: /datos
  containers:
    - name: app
      image: busybox:1.37
      command: ["sh", "-c", "while true; do echo \"$(date) pedido procesado\" >> /datos/app.log; sleep 3; done"]
      volumeMounts:
        - name: datos
          mountPath: /datos
