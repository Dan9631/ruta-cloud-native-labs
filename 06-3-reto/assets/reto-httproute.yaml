# Reto del modulo 06 - HTTPRoute de la tienda, colgada del Gateway compartido traefik-gateway
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: tienda
  namespace: lab-06
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /lab06/gw-tienda
      backendRefs:
        - name: tienda
          port: 8080
