# Static pod de prueba: el kubelet de node01 lo arranca al encontrar este archivo
# en su directorio de static pods. No pasa por el scheduler.
apiVersion: v1
kind: Pod
metadata:
  name: estatico
  namespace: lab-02
  labels:
    app: estatico
spec:
  containers:
    - name: nginx
      image: nginx:1.27-alpine
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          memory: 64Mi
